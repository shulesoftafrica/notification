; Supervisor programs for the notification service.
; Install:  sudo cp deploy/supervisor/notification.conf /etc/supervisor/conf.d/notification.conf
;           sudo supervisorctl reread && sudo supervisorctl update
; Remove any older notification worker config first so workers are not doubled.
;
; Timing rules (keep in sync with config/queue.php and the job classes):
;   job $timeout (DispatchMessage 120s) < --timeout (150s) < redis retry_after (200s)
;   stopwaitsecs (210s) > --timeout, so a restart lets in-flight sends finish.

[program:notification-send]
process_name=%(program_name)s_%(process_num)02d
command=php /usr/share/nginx/html/notification/artisan queue:work redis --queue=notifications-urgent,notifications-high,notifications,notifications-low --sleep=1 --timeout=150 --max-time=3600 --max-jobs=1000 --memory=256
directory=/usr/share/nginx/html/notification
; Throughput is capped by provider rate limits (config/throttling.php), not worker count.
numprocs=8
user=www-data
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=210
redirect_stderr=true
stdout_logfile=/usr/share/nginx/html/notification/storage/logs/queue-send.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:notification-webhooks]
process_name=%(program_name)s_%(process_num)02d
command=php /usr/share/nginx/html/notification/artisan queue:work redis --queue=webhooks,status-updates,default --sleep=3 --timeout=60 --max-time=3600 --max-jobs=1000 --memory=256
directory=/usr/share/nginx/html/notification
numprocs=2
user=www-data
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/usr/share/nginx/html/notification/storage/logs/queue-webhooks.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:notification-scheduler]
process_name=%(program_name)s
command=php /usr/share/nginx/html/notification/artisan schedule:work
directory=/usr/share/nginx/html/notification
numprocs=1
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/usr/share/nginx/html/notification/storage/logs/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[group:notification]
programs=notification-send,notification-webhooks,notification-scheduler
